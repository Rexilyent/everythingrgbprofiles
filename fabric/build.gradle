plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

ext.loaderName = 'fabric'
apply from: rootProject.file('gradle/loader.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 1.21 still ships obfuscated, because of course it does. So the code is
    // written against Mojang's own names (same ones NeoForge and common use)
    // and Loom remaps the finished jar to intermediary on the way out. The
    // 26.x branches get to skip this whole ritual since Mojang finally gave
    // up on obfuscating. Lucky them.
    mappings loom.officialMojangMappings()
    // modImplementation, not implementation. Loader and API are published in
    // intermediary, so Loom has to remap them into dev names as well, or
    // nothing links and the compiler has a very bad day.
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // Required, and installed by the player rather than shipped inside our
    // jar. Nearly every Fabric mod needs it, so nearly every Fabric player
    // already has it. Nothing else gets added; see the JNA note in
    // neoforge/build.gradle, which holds here too.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            runDir = "../run/fabric/${name}"
        }
    }
}
