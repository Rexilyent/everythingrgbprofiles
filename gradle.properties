org.gradle.java.home=C:\\Program Files\\Java\\jdk-25.0.4
# Gradle's own heap, not the game's. NeoGradle builds the client-extra jar by
# holding the whole client jar in memory, and from Minecraft 1.21.5 that no
# longer fits in the daemon's default heap: the build dies with an
# OutOfMemoryError in create<version>ClientExtraJar before compiling anything.
org.gradle.jvmargs=-Xmx4G
mod_version=0.1.1
mod_group_id=dev.forgeeverything.everythingrgbprofiles
mod_id=everythingrgbprofiles
mod_name=Everything RGB Profiles
mod_license=Everything RGB Profiles License (source-available, see LICENSE)
mod_authors=Forge Everything Team
mod_description=Reactive RGB keyboard lighting in the style of Terraria. Your keyboard shows the biome you're in, the boss you're fighting and what's happening to you.
minecraft_version=26.3
# Both ranges cover only the version this branch is built for: Minecraft 26.3
# on NeoForge 26.3.0.92 and later 26.3 builds. An earlier version declared
# [1.21.1,1.22) and [21.1,), which let the mod load on 1.21.2 through 1.21.11
# and on every future NeoForge, where it has never run and can crash mid-game.
# A version outside these ranges now gets NeoForge's clear "requires" screen at
# launch instead. Widen them only after testing on the new version.
minecraft_version_range=[26.3,26.4)
neo_version=26.3.0.92
neo_version_range=[26.3.0.92,26.4)
loader_version_range=[1,)
# --- Build plugins ------------------------------------------------------------
# ModDevGradle builds common (against plain Minecraft, through NeoForm) and the
# NeoForge jar. Loom builds the Fabric jar; from 26.1 Minecraft ships without
# obfuscation, so it needs no mappings at all.
moddev_version=2.0.148
loom_version=1.19.2
# Plain Minecraft for common to compile against. Has to be the same game
# version as minecraft_version, or common compiles against a different game
# than the jars run in.
neoform_version=26.3-1
# Only for compiling common's one mixin. Each loader brings its own Mixin at
# runtime, so nothing from this lands in a jar.
mixin_version=0.17.5+mixin.0.8.7

# --- Fabric -------------------------------------------------------------------
fabric_loader_version=0.19.5
fabric_api_version=0.164.0+26.3
# What fabric.mod.json accepts. Same rule as the NeoForge ranges above: only
# the version this branch is built and tested for.
fabric_minecraft_version_range=~26.3
fabric_loader_version_range=>=0.19.5
