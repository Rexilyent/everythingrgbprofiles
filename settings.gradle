pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Finds and downloads the JDK the toolchain below asks for. 0.8.0 reads a
    // field Gradle 9 removed, so it dies with a NoSuchFieldError on
    // JvmVendorSpec.IBM_SEMERU the moment a toolchain has to be resolved —
    // which surfaced as the decompile step failing, not as a toolchain error.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'everythingrgbprofiles'

// common holds the mod itself and compiles against plain Minecraft, with no
// loader anywhere on its classpath. Each loader project compiles common's
// sources into its own jar alongside a thin layer of its own, so every jar
// stands alone: nothing nested inside it, nothing for a player to install
// next to it beyond the loader.
include 'common'
include 'neoforge'
