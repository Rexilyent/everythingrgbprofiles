pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'everythingrgbprofiles'

// common holds the mod itself and compiles against plain Minecraft, with no
// loader anywhere on its classpath. Each loader project compiles common's
// sources into its own jar alongside a thin layer of its own, so every jar
// stands alone: nothing nested inside it, nothing for a player to install
// next to it beyond the loader.
include 'common'
include 'neoforge'
